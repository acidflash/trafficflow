services:
  app:
    build: .
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      DATABASE_PATH: /data/trafficflow.db
      TZ: ${TZ:-Europe/Stockholm}
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
    restart: unless-stopped
volumes:
  app_data:
